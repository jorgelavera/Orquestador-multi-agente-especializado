[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-research-orchestrator"
version = "0.1.0"
description = "A bounded, locally runnable LangGraph research and analysis prototype."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chromadb>=1.0,<2",
  "langgraph>=1.0,<2",
  "openai>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=1.0,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
